[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueraven-visualizer"
version = "0.1.0"
description = "3D orientation + telemetry dashboard visualizer for Featherweight Blue Raven flight-computer logs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rex McAllister" }]
keywords = ["rocketry", "telemetry", "blue-raven", "featherweight", "flight-data", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=9.0",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
pyvista = ["pyvista>=0.44", "vtk>=9.2", "imageio>=2.30"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/rex-mcall/Shred-O-Vision"
Repository = "https://github.com/rex-mcall/Shred-O-Vision"
Issues = "https://github.com/rex-mcall/Shred-O-Vision/issues"

[project.scripts]
blueraven-visualizer = "blueraven_visualizer.cli:main"
# Alias matching the repo name, so `shred-o-vision` works too.
shred-o-vision = "blueraven_visualizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
