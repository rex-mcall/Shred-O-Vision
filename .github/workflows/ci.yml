name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    name: core (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The pyvista-only and GUI-only tests skip themselves when the optional
      # dependency / a usable display isn't present.
      - run: pytest -v

  test-pyvista:
    name: pyvista extra (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pyvista/setup-headless-display-action@v3
      - run: pip install -e ".[dev,pyvista]"
      - run: pytest -v tests/test_render_pyvista_smoke.py
