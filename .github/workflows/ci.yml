name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v

  test-pyvista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pyvista/setup-headless-display-action@v3
      - run: pip install -e ".[dev,pyvista]"
      - run: pytest -v tests/test_render_pyvista_smoke.py
